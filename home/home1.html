<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero v5.1</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ===== HERO WRAPPER ===== */
        .hero-wrapper {
            color: #fff;
            background: #02111e;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }

        .hero-wrapper * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ===== BACKGROUND ===== */
        .bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            filter: brightness(0.8);
            z-index: 0;
        }

        .bg img,
        .bg video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .bg .desktop-bg { display: block; }
        .bg .mobile-bg { display: none; }

        @media (max-width: 768px) {
            .bg .desktop-bg { display: none; }
            .bg .mobile-bg { display: block; }
        }

        /* ===== OVERLAY ===== */
        .overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(2, 17, 30, 0.7);
            top: 0;
            left: 0;
            z-index: 1;
            pointer-events: none;
        }

        /* ===== CONTAINER ===== */
        .container {
            width: 100%;
            min-height: 100vh;
            padding-left: 40px;
            padding-right: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            z-index: 2;
            padding-top: 80px;
        }

        .flex-hero {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex: 1;
            margin-top: 40px;
            flex-wrap: wrap;
        }

        .hero-left {
            max-width: 600px;
            width: 100%;
        }

        /* ===== TITLE STYLES ===== */

        /* ===== DESCRIPTION ===== */
        .desc {
            font-size: 18px;
            color: #c1d4ef;
            margin-bottom: 25px;
            text-align: left;
            line-height: 1.6;
        }

        /* ===== BUTTONS ===== */
        .btn-row {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: flex-start;
        }

        .btn {
            background: linear-gradient(282deg, #18c0ec 56%, #002981 117%);
            border: none;
            padding: 10px 28px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            min-width: 140px;
            font-family: inherit;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before { left: 100%; }

        .btn.secondary {
            background: transparent;
            border: 1.5px solid #18c0ec;
        }

        .btn:hover {
            filter: brightness(1.1);
            transform: translateY(-2px);
        }

        .btn i {
            font-size: 18px;
        }

        .btn img {
            width: 18px;
            height: 18px;
            object-fit: contain;
        }

        /* ===== RATING ===== */
        .stars-row {
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .stars {
            color: #14e2fc;
            letter-spacing: 2px;
            font-size: 18px;
        }

        .rating-main {
            color: #ffffff;
            font-size: 14px;
        }

        .rating-main span {
            font-size: 32px;
            font-weight: 800;
            color: #fff;
        }

        /* ===== BOTTOM BAR ===== */
        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: min(600px, 90vw);
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 12px 10px;
            backdrop-filter: blur(10px);
            position: absolute;
            right: 5%;
            bottom: 30px;
            flex-wrap: wrap;
            gap: 0;
        }

        .item {
            flex: 1;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 10px;
            transition: 0.3s;
            border-right: 1px solid #c2dafc8c;
            min-width: 150px;
            flex-direction: column;
        }

        .item:last-child { border: none; }
        .item:hover { transform: translateY(-5px); }

        .item .text-content {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .item .label {
            font-size: 13px;
            color: #c1d4ef;
            font-weight: 400;
            text-transform: capitalize;
            line-height: 1;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .item .label .icon {
            color: #87d4f8;
            font-size: 32px;
            display: flex;
            align-items: center;
        }

        .item .label .icon img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .item .name {
            font-weight: 700;
            line-height: 1;
            font-size: 22px;
            color: #ffffff;
        }

        /* ===== TEXT ANIMATION ===== */
        .big-title,
        .desc {
            --stagger-word: 0.1s;
            --stagger-line: 0.1s;
            --move-distance: 30px;
            --speed: 1s;
            --ease: cubic-bezier(.16,.84,.36,1);
        }

        .desc {
            --stagger-word: 0.1s;
            --move-distance: 20px;
            --speed: 0.8s;
            --ease: cubic-bezier(.16,.84,.36,1);
        }

        .anim-clip {
            display: inline-block;
            overflow: hidden;
            vertical-align: baseline;
        }

        .anim-item {
            display: inline-block;
            opacity: 0;
            transform: translateY(var(--move-distance));
            transition: transform var(--speed) var(--ease), opacity var(--speed) var(--ease);
            will-change: transform, opacity;
            white-space: pre-wrap;
            animation-fill-mode: both;
            font-family: inherit;
        }

        .anim-item.show {
            opacity: 1;
            transform: translateY(0);
        }

        .big-title.line .anim-line {
            display: block;
            margin-bottom: 0.1em;
        }

        .big-title.word .anim-item {
            margin-right: 0.25em;
        }

        .big-title.word .anim-item:last-child { margin-right: 0; }

        .big-title.letter .anim-item {
            margin-right: -0.05em;
        }

        /* ===== SIMPLE ANIMATIONS ===== */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .animate-element {
            opacity: 0;
            animation: fadeInUp 0.8s cubic-bezier(.34,1.56,.64,1) forwards;
        }

        .animate-delay-1 { animation-delay: 0.2s; }
        .animate-delay-2 { animation-delay: 0.4s; }
        .animate-delay-3 { animation-delay: 0.6s; }

        @media (prefers-reduced-motion: reduce) {
            .anim-item,
            .animate-element {
                transition: none !important;
                animation: none !important;
                opacity: 1 !important;
                transform: none !important;
            }
        }

        /* ===== TABLET (< 992px) ===== */
        @media (max-width: 992px) {
            .container { padding-top: 60px; }
            .title-line1 { font-size: 48px; }
            .title-line2 { font-size: 64px; }
            .title-line3 { font-size: 48px; }
            .desc { font-size: 16px; }
            .btn { font-size: 15px; padding: 10px 24px; }
            .btn i, .btn img { font-size: 16px; width: 16px; height: 16px; }
            .stars-row { display: none; }
            .flex-hero { justify-content: end; }
            .bottom-bar { padding: 10px 8px; gap: 0; }
            .item .label { font-size: 12px; }
            .item .name { font-size: 20px; }
        }

        /* ===== MOBILE (< 768px) ===== */
        @media (max-width: 768px) {
            .container {
                padding-left: 16px;
                padding-right: 16px;
                padding-top: 40px;
            }
            .flex-hero {
                flex-direction: column;
                align-items: flex-start;
                margin-top: 30px;
            }
            .title-line1 { font-size: 36px; }
            .title-line2 { font-size: 48px; }
            .title-line3 { font-size: 36px; }
            .desc { font-size: 15px; margin-bottom: 20px; }
            .btn-row { gap: 12px; width: 100%; }
            .btn { font-size: 14px; padding: 12px 22px; width: auto; min-width: 0; }
            .btn i, .btn img { font-size: 16px; width: 16px; height: 16px; }
            .bottom-bar {
                position: relative;
                right: 0;
                margin-top: 50px;
                width: 100%;
                justify-content: space-between;
                padding: 14px 10px;
                gap: 10px;
                flex-wrap: nowrap;
            }
            .item {
                min-width: auto;
                flex: 1;
                padding: 10px;
                border-right: 1px solid #c2dafc8c;
            }
            .item:last-child { border-right: none; }
            .item .label { font-size: 11px; gap: 6px; }
            .item .name { font-size: 18px; }
        }

        /* ===== SMALL MOBILE (< 480px) ===== */
        @media (max-width: 480px) {
            .title-line1 { font-size: 28px; }
            .title-line2 { font-size: 36px; }
            .title-line3 { font-size: 28px; }
            .desc { font-size: 14px; }
            .btn { width: 100%; font-size: 13px; padding: 12px; }
            .bottom-bar { flex-wrap: wrap; }
            .item {
                flex: 1 1 100%;
                border-right: none;
                border-bottom: 1px solid #c2dafc8c;
                padding: 8px;
            }
            .item:last-child { border-bottom: none; }
            .item .label { font-size: 10px; }
            .item .name { font-size: 16px; }
        }

        @media print {
            .bg, .overlay { display: none; }
        }
    </style>

<body>

    <script>
        (function() {
            'use strict';

            // Counter Animation
            const counter = document.querySelector(".counter");
            if (counter) {
                const target = parseFloat(counter.getAttribute("data-target")) || 0;
                const increment = target / 50;
                let current = 0;

                const updateCounter = () => {
                    if (current < target) {
                        current += increment;
                        counter.textContent = current.toFixed(1);
                        setTimeout(updateCounter, 40);
                    } else {
                        counter.textContent = target.toFixed(1);
                    }
                };

                const counterObserver = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            updateCounter();
                            counterObserver.unobserve(entry.target);
                        }
                    });
                }, { threshold: 0.1 });

                counterObserver.observe(counter);
            }

            // Animation Manager
            const AnimationManager = {
                splitText(text, type) {
                    const tokens = [];
                    if (type === 'letter') {
                        return text.split('').map(char => ({
                            content: char === ' ' ? '\u00A0' : char
                        }));
                    }
                    const words = text.split(/(\s+)/).filter(Boolean);
                    return words.map(word => ({
                        content: word,
                        isSpace: /^\s+$/.test(word)
                    }));
                },

                prepareElement(el) {
                    if (el.dataset.prepared) return;
                    const type = el.dataset.anim;
                    const titleLines = el.querySelectorAll('.title-line1, .title-line2, .title-line3');

                    if (titleLines.length > 0) {
                        titleLines.forEach(line => {
                            const text = line.getAttribute('data-text') || line.textContent.trim();
                            const tokens = this.splitText(text, type);
                            const fragment = document.createDocumentFragment();

                            tokens.forEach(token => {
                                const clip = document.createElement('span');
                                clip.className = 'anim-clip';
                                const item = document.createElement('span');
                                item.className = 'anim-item';
                                item.innerHTML = token.isSpace ? '\u00A0' : token.content;
                                clip.appendChild(item);
                                fragment.appendChild(clip);
                            });

                            line.innerHTML = '';
                            line.appendChild(fragment);
                        });
                    } else {
                        const originalText = el.dataset.originalText || el.textContent.trim();
                        el.innerHTML = '';
                        const tokens = this.splitText(originalText, type);
                        const fragment = document.createDocumentFragment();

                        tokens.forEach(token => {
                            const clip = document.createElement('span');
                            clip.className = 'anim-clip';
                            const item = document.createElement('span');
                            item.className = 'anim-item';
                            item.innerHTML = token.isSpace ? '\u00A0' : token.content;
                            clip.appendChild(item);
                            fragment.appendChild(clip);
                        });

                        el.appendChild(fragment);
                    }

                    el.dataset.prepared = '1';
                    if (type === 'line') {
                        requestAnimationFrame(() => this.groupIntoLines(el));
                    }
                },

                groupIntoLines(el) {
                    const clips = Array.from(el.querySelectorAll('.anim-clip'));
                    if (!clips.length) return;

                    const containerWidth = el.offsetWidth;
                    if (!containerWidth) return;

                    const lines = [];
                    let currentLine = { top: 0, items: [] };

                    clips.forEach((clip, index) => {
                        const rect = clip.getBoundingClientRect();
                        const elRect = el.getBoundingClientRect();
                        const relativeTop = rect.top - elRect.top;

                        if (index === 0 || Math.abs(relativeTop - currentLine.top) > 5) {
                            if (currentLine.items.length) {
                                lines.push(currentLine);
                            }
                            currentLine = { top: relativeTop, items: [] };
                        }
                        currentLine.items.push(clip);
                    });

                    if (currentLine.items.length) lines.push(currentLine);

                    el.innerHTML = '';
                    const fragment = document.createDocumentFragment();
                    lines.forEach(line => {
                        const lineWrap = document.createElement('div');
                        lineWrap.className = 'anim-line';
                        line.items.forEach(item => lineWrap.appendChild(item));
                        fragment.appendChild(lineWrap);
                    });
                    el.appendChild(fragment);
                },

                animateElement(el) {
                    const type = el.dataset.anim;
                    const cs = getComputedStyle(el);
                    const staggerWord = parseFloat(cs.getPropertyValue('--stagger-word')) || 0.1;
                    const staggerLine = parseFloat(cs.getPropertyValue('--stagger-line')) || 0.1;

                    requestAnimationFrame(() => {
                        if (type === 'line') {
                            const lines = Array.from(el.querySelectorAll('.anim-line'));
                            lines.forEach((line, lineIndex) => {
                                const items = Array.from(line.querySelectorAll('.anim-item'));
                                items.forEach((item, itemIndex) => {
                                    const delay = lineIndex * staggerLine + itemIndex * staggerWord;
                                    item.style.transitionDelay = delay + 's';
                                    item.classList.add('show');
                                });
                            });
                        } else {
                            const items = Array.from(el.querySelectorAll('.anim-item'));
                            items.forEach((item, index) => {
                                item.style.transitionDelay = index * staggerWord + 's';
                                item.classList.add('show');
                            });
                        }
                    });
                }
            };

            // Setup animations
            const animatedElements = document.querySelectorAll('[data-anim]');
            const io = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (!entry.isIntersecting) return;
                    const el = entry.target;
                    AnimationManager.prepareElement(el);
                    setTimeout(() => AnimationManager.animateElement(el), 100);
                    io.unobserve(el);
                });
            }, { root: null, rootMargin: '0px 0px -10% 0px', threshold: 0.1 });

            animatedElements.forEach(el => io.observe(el));
        })();
    </script>
